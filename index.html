<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liamz</title>

    <style>

        body {
            font-family: Verdana;
        }

        .title {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: lightblue;
            text-align: center;
            padding: 5px;
            color: white;
        }

        .subtitle {
            background-color: gray;
            color: white;
            text-align: center;
            padding: 2px;
        }

        .container {
            background-color: rgb(231, 243, 245);
            padding: 5px;
            text-align: center;
        }
        .content {
            display: flex;
            gap: 25px;
            align-items: center;


        }
        .side,
        .imagecontainer {
            flex: 1;
        }

        .imagecontainer {
            display: flex;
            justify-content: flex-end;
        }
        .item {
            text-align: center;
        }

        .GoButton {
            text-align: center;
        }

        .GoButton button {
            background-color: lightblue;
            color: white;
            border: rgb(37, 90, 151) 1px solid;
            padding: 10px 20px;
            font-size: 2em;
        }

    </style>

</head>
<body>
    
<div class="title">
    <img src="images/logo.png" height="100" width="auto" alt="Liamz Logo">
    <h1><big>Liamz</big></h1>
</div>
<div class="subtitle">
    <h3>liamz.vip</h3>
</div>
<br>
<div class="container">
    <h1>Meet the new <a style="color: blue;">LiamzStudio</a></h1>
    <div class="content">
        <div class="side"></div>
        <div class="item">
            <h3>LiamzStudio will now be the primary account for hosting Liamz Content!</h3>
        </div>

        <div class="imagecontainer">
            <img src="images/LZS.png" alt="Voltage Logo" width="300" height="auto">
        </div>
    </div>
</div>
<br>
<div class="container">

    <h1>Voltage</h1>
    
    <div class="content">
        <div class="side"></div>
        <div class="item">
            <h3>Indie games website with a variety of game options</h3>
            <p>Voltage will be changing from L14M30 to LiamzStudio</p>
        </div>

        <div class="imagecontainer">
            <img src="images/voltagenew.png" alt="Voltage Logo" width="200" height="auto">
        </div>
    </div>

    <div class="GoButton">
        <button type="button" onclick="window.open('https://voltage.liamz.vip', '_blank')">Visit</button>
    </div>

</div>

</body>
</html>
